name: Feature request
description: Suggest a change to the studio or its workflows.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The project's direction is still forming, so ideas are welcome as input but may not be picked up soon.
        Talk an idea through here before opening a pull request for it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change you'd like. Sketches or screenshots help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you've considered.
